services:
  - type: web
    name: fundaai-backend
    rootDir: html-backend
    runtime: node
    plan: free
    buildCommand: node --check server.mjs
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: API_ONLY
        value: "true"
      - key: FRONTEND_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500,null
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
